<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="ah-aqua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="960" height="520" rx="12" fill="#fcfcfb"/><text x="40" y="40" font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">How the models were trained</text><rect x="40" y="80" width="210" height="110" rx="10" fill="#f0efec" stroke="#d8d7d0" stroke-width="1.5"/><text x="145.0" y="114.5" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Train set</text><text x="145.0" y="133.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">10,607 sequences</text><text x="145.0" y="150.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">(older period,</text><text x="145.0" y="167.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">no scoring mask)</text><rect x="330" y="70" width="270" height="130" rx="10" fill="#faede7" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="6 4"/><text x="465.0" y="114.5" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Teacher (training only)</text><text x="465.0" y="133.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">a GRU that may look ahead:</text><text x="465.0" y="150.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">it gets the average of the</text><text x="465.0" y="167.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">next 2–50 rows as inputs</text><rect x="680" y="80" width="240" height="110" rx="10" fill="#faede7" stroke="#eb6834" stroke-width="1.5"/><text x="800.0" y="114.5" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Soft labels</text><text x="800.0" y="133.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">0.2 · real target</text><text x="800.0" y="150.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">+ 0.8 · teacher prediction</text><text x="800.0" y="167.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">(denoised target)</text><path d="M250,135 L328,135" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#ah-muted)"/><path d="M600,135 L678,135" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#ah-muted)"/><rect x="40" y="250" width="560" height="110" rx="10" fill="#e7eff7" stroke="#2a78d6" stroke-width="1.5"/><text x="320.0" y="293.0" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Students: the models that ship (see only the past)</text><text x="320.0" y="312.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">4 regime specialists (minGRU + tick-class head)  ·  SSM  ·  TCN</text><text x="320.0" y="329.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">loss = weighted MSE + 3 · (1 − weighted correlation)</text><path d="M800,190 L600,290" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#ah-muted)"/><text x="740.0" y="236.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">trained on</text><path d="M145,190 L145,248" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#ah-muted)"/><rect x="680" y="250" width="240" height="110" rx="10" fill="#f0efec" stroke="#d8d7d0" stroke-width="1.5"/><text x="800.0" y="293.0" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Validation set</text><text x="800.0" y="312.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">1,873 sequences, newer,</text><text x="800.0" y="329.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">with the real scoring mask</text><rect x="40" y="405" width="360" height="95" rx="10" fill="#e7eff7" stroke="#2a78d6" stroke-width="1.5"/><text x="220.0" y="440.5" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Fine-tune on validation</text><text x="220.0" y="459.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">3 epochs · scored rows weighted ×5</text><text x="220.0" y="476.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">two halves (out-of-fold) + full fit</text><rect x="470" y="405" width="210" height="95" rx="10" fill="#faede7" stroke="#eb6834" stroke-width="1.5"/><text x="575.0" y="440.5" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Row stack</text><text x="575.0" y="459.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">LightGBM on out-</text><text x="575.0" y="476.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">of-fold predictions</text><rect x="745" y="405" width="175" height="95" rx="10" fill="#e6f4ee" stroke="#1baf7a" stroke-width="1.5"/><text x="832.5" y="440.5" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Package</text><text x="832.5" y="459.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">numba · int16</text><text x="832.5" y="476.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">weights · 12 MB</text><path d="M160,360 L160,403" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#ah-muted)"/><path d="M800,360 L800,382 L330,382 L330,403" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#ah-muted)"/><text x="565" y="376" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">same validation data</text><path d="M400,452 L468,452" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#ah-muted)"/><path d="M680,452 L743,452" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#ah-muted)"/></svg>