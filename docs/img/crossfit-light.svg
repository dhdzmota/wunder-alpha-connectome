<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="ah-aqua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="960" height="400" rx="12" fill="#fcfcfb"/><text x="40" y="40" font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">Deciding what ships: out-of-fold scores on two halves of validation</text><text x="40" y="110" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">Model 1</text><rect x="140" y="88" width="300" height="34" rx="6" fill="#cedff3" stroke="#2a78d6"/><rect x="446" y="88" width="300" height="34" rx="6" fill="#f0efec" stroke="#eb6834"/><text x="290" y="110" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="middle">fine-tune here</text><text x="596" y="110" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="middle">predict here</text><text x="40" y="180" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">Model 2</text><rect x="140" y="158" width="300" height="34" rx="6" fill="#f0efec" stroke="#2a78d6"/><rect x="446" y="158" width="300" height="34" rx="6" fill="#f8dbcf" stroke="#eb6834"/><text x="290" y="180" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="middle">predict here</text><text x="596" y="180" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="middle">fine-tune here</text><text x="290" y="74" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">validation half A</text><text x="596" y="74" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">validation half B</text><rect x="140" y="240" width="606" height="60" rx="10" fill="#e6f4ee" stroke="#1baf7a" stroke-width="1.5"/><text x="443.0" y="275.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Every validation row is predicted by a model that never trained on it</text><path d="M443,222 L443,238" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#ah-muted)"/><rect x="780" y="80" width="140" height="220" rx="10" fill="#edebf7" stroke="#6250d6" stroke-width="1.5"/><text x="850.0" y="152.5" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Gate</text><text x="850.0" y="171.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">a change ships</text><text x="850.0" y="188.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">only if it</text><text x="850.0" y="205.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">improves the</text><text x="850.0" y="222.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">score on</text><text x="850.0" y="239.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">both halves</text><text x="443" y="340" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">The shipped model is fitted on all of validation; the two half-models only measure.</text><text x="443" y="362" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">Public leaderboard gains were 35–60 % of these out-of-fold gains.</text></svg>