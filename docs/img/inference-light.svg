<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="ah-aqua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="960" height="540" rx="12" fill="#fcfcfb"/><text x="40" y="40" font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">What runs on the scoring server, for every row</text><rect x="40" y="70" width="220" height="105" rx="10" fill="#f0efec" stroke="#d8d7d0" stroke-width="1.5"/><text x="150.0" y="110.5" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Row t</text><text x="150.0" y="129.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">112 features</text><text x="150.0" y="146.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">+ change since the previous row</text><rect x="330" y="70" width="300" height="105" rx="10" fill="#edebf7" stroke="#6250d6" stroke-width="1.5"/><text x="480.0" y="102.0" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Regime detector</text><text x="480.0" y="121.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">reads warm-up rows 0–98 and guesses</text><text x="480.0" y="138.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">the tick size of this sequence&#x27;s</text><text x="480.0" y="155.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">target (4 possible grids)</text><rect x="700" y="70" width="220" height="105" rx="10" fill="#f0efec" stroke="#d8d7d0" stroke-width="1.5"/><text x="810.0" y="102.0" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Budget</text><text x="810.0" y="121.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">1 CPU core, 60 minutes</text><text x="810.0" y="138.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">for the whole test set;</text><text x="810.0" y="155.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">final run: 51 minutes</text><path d="M260,122 L328,122" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#ah-muted)"/><rect x="40" y="225" width="880" height="150" rx="12" fill="none" stroke="#d8d7d0" stroke-width="1.5" stroke-dasharray="6 4"/><text x="60" y="250" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Route r: one fused numba call per row</text><text x="900" y="250" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="end">blend p = weighted average of the three</text><rect x="60" y="268" width="260" height="90" rx="10" fill="#e7eff7" stroke="#2a78d6" stroke-width="1.5"/><text x="190.0" y="301.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">minGRU specialist</text><text x="190.0" y="320.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">recurrent, trained on regime r only</text><text x="190.0" y="337.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">weight 0.50</text><rect x="350" y="268" width="260" height="90" rx="10" fill="#e7eff7" stroke="#2a78d6" stroke-width="1.5"/><text x="480.0" y="301.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">SSM</text><text x="480.0" y="320.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">state-space model, shared</text><text x="480.0" y="337.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">weight ≈ 0.25</text><rect x="640" y="268" width="260" height="90" rx="10" fill="#e7eff7" stroke="#2a78d6" stroke-width="1.5"/><text x="770.0" y="301.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">TCN</text><text x="770.0" y="320.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">convolution over the last 1,024 rows</text><text x="770.0" y="337.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">weight ≈ 0.25</text><path d="M150,175 L150,223" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#ah-muted)"/><path d="M480,175 L480,223" fill="none" stroke="#6250d6" stroke-width="1.8" marker-end="url(#ah-violet)"/><text x="492.0" y="203.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">picks route r (once per sequence)</text><rect x="40" y="420" width="470" height="95" rx="10" fill="#faede7" stroke="#eb6834" stroke-width="1.5"/><text x="275.0" y="455.5" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Row stack (routes 0 and 1 only)</text><text x="275.0" y="474.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">LightGBM on (x, Δx, p):  ŷ = 0.65 · p + 0.35 · trees</text><text x="275.0" y="491.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">routes 2 and 3:  ŷ = p</text><rect x="590" y="420" width="330" height="95" rx="10" fill="#e6f4ee" stroke="#1baf7a" stroke-width="1.5"/><text x="755.0" y="455.5" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Prediction for row t</text><text x="755.0" y="474.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">t0, t1; the state is</text><text x="755.0" y="491.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">carried to the next row</text><path d="M275,375 L275,418" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#ah-muted)"/><text x="285.0" y="400.5" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">p</text><path d="M510,467 L588,467" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#ah-muted)"/></svg>