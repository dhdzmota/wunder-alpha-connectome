<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d95926"/></marker><marker id="ah-aqua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#199e70"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9085e9"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker></defs><rect width="1200" height="760" rx="12" fill="#1a1a19"/><text x="36" y="44" font-size="22" font-weight="700" fill="#f0efec" text-anchor="start">How the model works, in five steps</text><text x="36" y="70" font-size="14" font-weight="400" fill="#c3c2b7" text-anchor="start">Every row of market data goes through the same five steps, one row at a time, 20,000 rows per sequence.</text><rect x="36" y="96" width="210" height="330" rx="14" fill="#262624" stroke="#3a3a37" stroke-width="1.8"/><rect x="50" y="112" width="182" height="140" rx="10" fill="#1a1a19"/><rect x="95.0" y="132" width="26" height="8" rx="2" fill="#d95926"/><rect x="95.0" y="143" width="40" height="8" rx="2" fill="#d95926"/><rect x="95.0" y="154" width="58" height="8" rx="2" fill="#d95926"/><rect x="95.0" y="165" width="34" height="8" rx="2" fill="#d95926"/><line x1="89.0" y1="179" x2="171.0" y2="179" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="95.0" y="187" width="48" height="8" rx="2" fill="#3987e5"/><rect x="95.0" y="198" width="62" height="8" rx="2" fill="#3987e5"/><rect x="95.0" y="209" width="30" height="8" rx="2" fill="#3987e5"/><rect x="95.0" y="220" width="22" height="8" rx="2" fill="#3987e5"/><text x="177.0" y="156" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="start">sell</text><text x="177.0" y="184" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="start">price</text><text x="177.0" y="212" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="start">buy</text><circle cx="66" cy="282" r="13" fill="#c3c2b7"/><text x="66" y="287" font-size="14" font-weight="700" fill="#1a1a19" text-anchor="middle">1</text><text x="86" y="287" font-size="15.5" font-weight="700" fill="#f0efec" text-anchor="start">New data arrives</text><text x="52" y="322" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">The market sends one row:</text><text x="52" y="343" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">prices and volumes of buy</text><text x="52" y="364" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">and sell orders for two</text><text x="52" y="385" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">instruments (112 numbers).</text><path d="M249,172 l12,10 l-12,10" fill="none" stroke="#898781" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="267" y="96" width="210" height="330" rx="14" fill="#322f43" stroke="#9085e9" stroke-width="1.8"/><rect x="281" y="112" width="182" height="140" rx="10" fill="#1a1a19"/><line x1="312.0" y1="190" x2="402.0" y2="190" stroke="#c3c2b7" stroke-width="2"/><line x1="312.0" y1="190" x2="312.0" y2="176" stroke="#c3c2b7" stroke-width="2"/><line x1="327.0" y1="190" x2="327.0" y2="176" stroke="#c3c2b7" stroke-width="2"/><line x1="342.0" y1="190" x2="342.0" y2="176" stroke="#c3c2b7" stroke-width="2"/><line x1="357.0" y1="190" x2="357.0" y2="176" stroke="#c3c2b7" stroke-width="2"/><line x1="372.0" y1="190" x2="372.0" y2="176" stroke="#c3c2b7" stroke-width="2"/><line x1="387.0" y1="190" x2="387.0" y2="176" stroke="#c3c2b7" stroke-width="2"/><line x1="402.0" y1="190" x2="402.0" y2="176" stroke="#c3c2b7" stroke-width="2"/><circle cx="380.0" cy="178" r="24" fill="#38354d" fill-opacity="0.6" stroke="#9085e9" stroke-width="4"/><line x1="397.0" y1="195" x2="416.0" y2="214" stroke="#9085e9" stroke-width="7" stroke-linecap="round"/><circle cx="330.0" cy="232" r="7" fill="none" stroke="#9085e9" stroke-width="2"/><circle cx="352.0" cy="232" r="7" fill="none" stroke="#9085e9" stroke-width="2"/><circle cx="374.0" cy="232" r="7" fill="#9085e9" stroke="#9085e9" stroke-width="2"/><circle cx="396.0" cy="232" r="7" fill="none" stroke="#9085e9" stroke-width="2"/><circle cx="297" cy="282" r="13" fill="#9085e9"/><text x="297" y="287" font-size="14" font-weight="700" fill="#1a1a19" text-anchor="middle">2</text><text x="317" y="287" font-size="15.5" font-weight="700" fill="#f0efec" text-anchor="start">Which market?</text><text x="283" y="322" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">From the first 99 rows it</text><text x="283" y="343" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">finds the step size of the</text><text x="283" y="364" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">price (one of 4 kinds) and</text><text x="283" y="385" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">picks the matching expert.</text><path d="M480,172 l12,10 l-12,10" fill="none" stroke="#898781" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="498" y="96" width="210" height="330" rx="14" fill="#203042" stroke="#3987e5" stroke-width="1.8"/><rect x="512" y="112" width="182" height="140" rx="10" fill="#1a1a19"/><rect x="516.0" y="142" width="54" height="54" rx="10" fill="#203042" stroke="#3987e5" stroke-width="1.8"/><path d="M556.0,164 A14,14 0 1,0 554.0,178" fill="none" stroke="#3987e5" stroke-width="3"/><path d="M550.0,160 L560.0,158 L558.0,168 Z" fill="#3987e5"/><text x="543.0" y="212" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">minGRU</text><rect x="576.0" y="142" width="54" height="54" rx="10" fill="#203042" stroke="#3987e5" stroke-width="1.8"/><path d="M585.0,169 C591.0,151 599.0,151 603.0,169 S615.0,187 621.0,169" fill="none" stroke="#3987e5" stroke-width="3"/><text x="603.0" y="212" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">SSM</text><rect x="636.0" y="142" width="54" height="54" rx="10" fill="#203042" stroke="#3987e5" stroke-width="1.8"/><rect x="644.0" y="171" width="6" height="8" fill="#3987e5" opacity="0.35"/><rect x="652.0" y="165" width="6" height="14" fill="#3987e5" opacity="0.35"/><rect x="660.0" y="169" width="6" height="10" fill="#3987e5" opacity="1"/><rect x="668.0" y="161" width="6" height="18" fill="#3987e5" opacity="1"/><rect x="676.0" y="167" width="6" height="12" fill="#3987e5" opacity="1"/><rect x="659.0" y="155" width="26" height="28" rx="3" fill="none" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="3 2"/><text x="663.0" y="212" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">TCN</text><text x="603.0" y="234" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">→ average of the three</text><circle cx="528" cy="282" r="13" fill="#3987e5"/><text x="528" y="287" font-size="14" font-weight="700" fill="#1a1a19" text-anchor="middle">3</text><text x="548" y="287" font-size="15.5" font-weight="700" fill="#f0efec" text-anchor="start">Use its memory</text><text x="514" y="322" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Three neural networks read</text><text x="514" y="343" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">the row and update their</text><text x="514" y="364" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">memory of everything seen</text><text x="514" y="385" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">so far in this sequence.</text><path d="M711,172 l12,10 l-12,10" fill="none" stroke="#898781" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="729" y="96" width="210" height="330" rx="14" fill="#40271c" stroke="#d95926" stroke-width="1.8"/><rect x="743" y="112" width="182" height="140" rx="10" fill="#1a1a19"/><line x1="834.0" y1="144" x2="802.0" y2="182" stroke="#d95926" stroke-width="2.5"/><line x1="834.0" y1="144" x2="866.0" y2="182" stroke="#d95926" stroke-width="2.5"/><line x1="802.0" y1="182" x2="786.0" y2="220" stroke="#d95926" stroke-width="2.5"/><line x1="802.0" y1="182" x2="818.0" y2="220" stroke="#d95926" stroke-width="2.5"/><line x1="866.0" y1="182" x2="850.0" y2="220" stroke="#d95926" stroke-width="2.5"/><line x1="866.0" y1="182" x2="882.0" y2="220" stroke="#d95926" stroke-width="2.5"/><circle cx="834.0" cy="144" r="11" fill="#5d301e" stroke="#d95926" stroke-width="2.5"/><circle cx="802.0" cy="182" r="9" fill="#5d301e" stroke="#d95926" stroke-width="2.5"/><circle cx="866.0" cy="182" r="9" fill="#5d301e" stroke="#d95926" stroke-width="2.5"/><circle cx="786.0" cy="220" r="7" fill="#5d301e" stroke="#d95926" stroke-width="2.5"/><circle cx="818.0" cy="220" r="7" fill="#5d301e" stroke="#d95926" stroke-width="2.5"/><circle cx="850.0" cy="220" r="7" fill="#5d301e" stroke="#d95926" stroke-width="2.5"/><circle cx="882.0" cy="220" r="7" fill="#5d301e" stroke="#d95926" stroke-width="2.5"/><circle cx="759" cy="282" r="13" fill="#d95926"/><text x="759" y="287" font-size="14" font-weight="700" fill="#1a1a19" text-anchor="middle">4</text><text x="779" y="287" font-size="15.5" font-weight="700" fill="#f0efec" text-anchor="start">Final correction</text><text x="745" y="322" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Small decision trees fine-</text><text x="745" y="343" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">tune the average with the</text><text x="745" y="364" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">raw row (only in the 2</text><text x="745" y="385" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">fine-step kinds of market).</text><path d="M942,172 l12,10 l-12,10" fill="none" stroke="#898781" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="960" y="96" width="210" height="330" rx="14" fill="#1a342a" stroke="#199e70" stroke-width="1.8"/><rect x="974" y="112" width="182" height="140" rx="10" fill="#1a1a19"/><circle cx="1051.0" cy="182" r="40" fill="#1a2a23" stroke="#199e70" stroke-width="3"/><circle cx="1051.0" cy="182" r="26" fill="#1a2a23" stroke="#199e70" stroke-width="3"/><circle cx="1051.0" cy="182" r="12" fill="#199e70" stroke="#199e70" stroke-width="0"/><line x1="1111.0" y1="178" x2="1111.0" y2="144" stroke="#199e70" stroke-width="4" marker-end="url(#ah-aqua)"/><line x1="1111.0" y1="186" x2="1111.0" y2="220" stroke="#898781" stroke-width="4" marker-end="url(#ah-muted)"/><circle cx="990" cy="282" r="13" fill="#199e70"/><text x="990" y="287" font-size="14" font-weight="700" fill="#1a1a19" text-anchor="middle">5</text><text x="1010" y="287" font-size="15.5" font-weight="700" fill="#f0efec" text-anchor="start">Prediction</text><text x="976" y="322" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Two numbers: in which</text><text x="976" y="343" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">direction and how far the</text><text x="976" y="364" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">price will move. Then the</text><text x="976" y="385" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">next row arrives.</text><path d="M1065.0,428 L1065.0,446 Q1065.0,456 1055.0,456 L151.0,456 Q141.0,456 141.0,446 L141.0,432" fill="none" stroke="#898781" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah-muted)"/><rect x="398.0" y="445" width="410" height="22" fill="#1a1a19"/><text x="603.0" y="461" font-size="13.5" font-weight="400" fill="#c3c2b7" text-anchor="middle" font-style="italic">repeat for the next row: the networks keep their memory</text><rect x="36" y="490" width="760" height="245" rx="14" fill="none" stroke="#3a3a37" stroke-width="1.5"/><text x="58" y="522" font-size="17" font-weight="700" fill="#f0efec" text-anchor="start">How the networks learned</text><circle cx="108" cy="570.8" r="12.0" fill="#5d301e" stroke="#d95926" stroke-width="2.2"/><path d="M86.4,611.6 C86.4,587.6 129.6,587.6 129.6,611.6 Z" fill="#5d301e" stroke="#d95926" stroke-width="2.2"/><path d="M128,568 L144,560 L144,578 Z" fill="#d95926"/><rect x="150" y="554" width="8" height="34" rx="2" fill="none" stroke="#d95926" stroke-width="1.6" stroke-dasharray="3 2"/><rect x="161" y="554" width="8" height="34" rx="2" fill="none" stroke="#d95926" stroke-width="1.6" stroke-dasharray="3 2"/><rect x="172" y="554" width="8" height="34" rx="2" fill="none" stroke="#d95926" stroke-width="1.6" stroke-dasharray="3 2"/><rect x="183" y="554" width="8" height="34" rx="2" fill="none" stroke="#d95926" stroke-width="1.6" stroke-dasharray="3 2"/><text x="171" y="604" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">future</text><text x="142" y="658" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="middle">A teacher model may peek</text><text x="142" y="677" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="middle">at the next 50 rows</text><text x="142" y="696" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="middle">(training only).</text><path d="M224,580 l10,9 l-10,9" fill="none" stroke="#898781" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="274" y="552" width="100" height="68" rx="8" fill="#1a1a19" stroke="#3a3a37" stroke-width="1.5"/><path d="M282,598 h14 v-26 h10 v34 h12 v-20 h14 v-12 h8 v28 h16" fill="none" stroke="#898781" stroke-width="2"/><path d="M282,594 C300,568 318,604 334,586 S358,576 366,594" fill="none" stroke="#d95926" stroke-width="3"/><text x="324" y="658" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="middle">Its answers are cleaner</text><text x="324" y="677" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="middle">than the raw, noisy</text><text x="324" y="696" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="middle">target (gray).</text><path d="M406,580 l10,9 l-10,9" fill="none" stroke="#898781" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="476" cy="581.6" r="9.0" fill="#254060" stroke="#3987e5" stroke-width="2.2"/><path d="M459.8,612.2 C459.8,594.2 492.2,594.2 492.2,612.2 Z" fill="#254060" stroke="#3987e5" stroke-width="2.2"/><circle cx="506" cy="573.2" r="10.5" fill="#254060" stroke="#3987e5" stroke-width="2.2"/><path d="M487.1,608.9 C487.1,587.9 524.9,587.9 524.9,608.9 Z" fill="#254060" stroke="#3987e5" stroke-width="2.2"/><circle cx="536" cy="581.6" r="9.0" fill="#254060" stroke="#3987e5" stroke-width="2.2"/><path d="M519.8,612.2 C519.8,594.2 552.2,594.2 552.2,612.2 Z" fill="#254060" stroke="#3987e5" stroke-width="2.2"/><text x="506" y="658" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="middle">The three networks learn</text><text x="506" y="677" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="middle">from those cleaner</text><text x="506" y="696" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="middle">answers.</text><path d="M588,580 l10,9 l-10,9" fill="none" stroke="#898781" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="654" y="560" width="68" height="60" rx="8" fill="#1a2e26" stroke="#199e70" stroke-width="2.2"/><rect x="654" y="560" width="68" height="16" rx="6" fill="#199e70"/><circle cx="666" cy="588" r="3" fill="#898781"/><circle cx="681" cy="588" r="3" fill="#898781"/><circle cx="696" cy="588" r="3" fill="#898781"/><circle cx="711" cy="588" r="3" fill="#898781"/><circle cx="666" cy="604" r="3" fill="#898781"/><circle cx="681" cy="604" r="3" fill="#898781"/><circle cx="696" cy="604" r="3" fill="#898781"/><circle cx="711" cy="604" r="5" fill="#199e70"/><text x="688" y="658" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="middle">Last lesson on the newest</text><text x="688" y="677" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="middle">data, where we know which</text><text x="688" y="696" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="middle">rows are scored.</text><rect x="826" y="490" width="338" height="245" rx="14" fill="none" stroke="#3a3a37" stroke-width="1.5"/><text x="848" y="522" font-size="17" font-weight="700" fill="#f0efec" text-anchor="start">Fast enough for the rules</text><rect x="918" y="549" width="14" height="9" rx="2" fill="#9085e9"/><circle cx="925" cy="595" r="34" fill="#2c2a38" stroke="#9085e9" stroke-width="4"/><path d="M925,595 L925,561 A34,34 0 1,1 894,581 Z" fill="#4f4a77"/><line x1="925" y1="595" x2="901" y2="585" stroke="#f0efec" stroke-width="3" stroke-linecap="round"/><circle cx="925" cy="595" r="4" fill="#f0efec"/><line x1="1047" y1="561" x2="1047" y2="569" stroke="#c3c2b7" stroke-width="2.5"/><line x1="1047" y1="621" x2="1047" y2="629" stroke="#c3c2b7" stroke-width="2.5"/><line x1="1031" y1="577" x2="1039" y2="577" stroke="#c3c2b7" stroke-width="2.5"/><line x1="1091" y1="577" x2="1099" y2="577" stroke="#c3c2b7" stroke-width="2.5"/><line x1="1059" y1="561" x2="1059" y2="569" stroke="#c3c2b7" stroke-width="2.5"/><line x1="1059" y1="621" x2="1059" y2="629" stroke="#c3c2b7" stroke-width="2.5"/><line x1="1031" y1="589" x2="1039" y2="589" stroke="#c3c2b7" stroke-width="2.5"/><line x1="1091" y1="589" x2="1099" y2="589" stroke="#c3c2b7" stroke-width="2.5"/><line x1="1071" y1="561" x2="1071" y2="569" stroke="#c3c2b7" stroke-width="2.5"/><line x1="1071" y1="621" x2="1071" y2="629" stroke="#c3c2b7" stroke-width="2.5"/><line x1="1031" y1="601" x2="1039" y2="601" stroke="#c3c2b7" stroke-width="2.5"/><line x1="1091" y1="601" x2="1099" y2="601" stroke="#c3c2b7" stroke-width="2.5"/><line x1="1083" y1="561" x2="1083" y2="569" stroke="#c3c2b7" stroke-width="2.5"/><line x1="1083" y1="621" x2="1083" y2="629" stroke="#c3c2b7" stroke-width="2.5"/><line x1="1031" y1="613" x2="1039" y2="613" stroke="#c3c2b7" stroke-width="2.5"/><line x1="1091" y1="613" x2="1099" y2="613" stroke="#c3c2b7" stroke-width="2.5"/><rect x="1039" y="569" width="52" height="52" rx="6" fill="#262624" stroke="#c3c2b7" stroke-width="2.2"/><text x="1065" y="601" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">1 CPU</text><text x="995" y="658" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="middle">About 0.1 milliseconds per row:</text><text x="995" y="677" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="middle">the whole test ran in 51 of the</text><text x="995" y="696" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="middle">60 allowed minutes, on a single</text><text x="995" y="715" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="middle">processor core.</text></svg>