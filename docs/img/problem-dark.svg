font-weight="400" fill="#c3c2b7" text-anchor="start">rows 0–98: warm-up</text><text x="40" y="151" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">(no prediction)</text><text x="546.136" y="134" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">rows 99–19,999: a prediction is required on every row</text><line x1="670" y1="148" x2="684" y2="148" stroke="#d95926" stroke-width="2.5"/><text x="690" y="152" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">hidden subset that is actually scored</text><rect x="40" y="210" width="250" height="120" rx="10" fill="#262624" stroke="#3a3a37" stroke-width="1.5"/><text x="165.0" y="249.5" font-size="15" font-weight="600" fill="#f0efec" text-anchor="middle">Row t (112 numbers)</text><text x="165.0" y="268.5" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">prices &amp; volumes of the book</text><text x="165.0" y="285.5" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">for instruments i0, i1</text><text x="165.0" y="302.5" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">+ 8 anonymous extras</text><rect x="375" y="210" width="230" height="120" rx="10" fill="#203042" stroke="#3987e5" stroke-width="1.5"/><text x="490.0" y="249.5" font-size="15" font-weight="600" fill="#f0efec" text-anchor="middle">Model with memory</text><text x="490.0" y="268.5" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">reads row t, updates</text><text x="490.0" y="285.5" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">its internal state,</text><text x="490.0" y="302.5" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">never sees the future</text><rect x="690" y="210" width="230" height="120" rx="10" fill="#1a342a" stroke="#199e70" stroke-width="1.5"/><text x="805.0" y="249.5" font-size="15" font-weight="600" fill="#f0efec" text-anchor="middle">Prediction for row t</text><text x="805.0" y="268.5" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">two numbers: t0, t1</text><text x="805.0" y="285.5" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">(future price moves</text><text x="805.0" y="302.5" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">of instrument i0)</text><path d="M290,270 L373,270" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#ah-muted)"/><path d="M605,270 L688,270" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#ah-muted)"/><path d="M455,330 C455,360 525,360 525,332" fill="none" stroke="#3987e5" stroke-width="1.8" marker-end="url(#ah-blue)"/><text x="490" y="370" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">state carried to row t+1</text><text x="805" y="362" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">Budget: 1 CPU core, 60 minutes</text><text x="805" y="378" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">for the whole test set</text></svg>